name: Manual PDF Build

on:
  workflow_dispatch: {}

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system fonts (CJK + Latin)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Point Quarto to this Python
        run: echo "QUARTO_PYTHON=$(which python)" >> $GITHUB_ENV

      - name: Cache TinyTeX
        uses: actions/cache@v4
        with:
          path: |
            ~/.TinyTeX
            ~/.texlive
            ~/.tlmgr
          key: ${{ runner.os }}-tinytex-2025-v1
          restore-keys: |
            ${{ runner.os }}-tinytex-

      - name: Install TinyTeX (if missing)
        run: |
          if [ ! -d "$HOME/.TinyTeX" ] && [ ! -d "$HOME/.texlive" ]; then
            quarto install tinytex --no-prompt
          fi

      - name: Install TeX packages (auto-detect)
        run: python scripts/install-tex-deps.py

      - name: Render book (PDF)
        run: |
          set +e
          quarto render --to pdf
          status=$?
          if [ $status -ne 0 ]; then
            python scripts/install-tex-deps.py
            quarto render --to pdf
          else
            exit 0
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarto-book-pdf
          path: _book/*.pdf
          if-no-files-found: error
