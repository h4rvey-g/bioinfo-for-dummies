<div id="cusdis_thread"
  data-host="https://cusdis.com"
  data-app-id="aef28c30-8eb9-4411-979e-1cc9a113e070">
</div>
<script>
  // Set page-specific metadata for Cusdis from the current document context
  (function () {
    const el = document.getElementById('cusdis_thread');
    if (!el) return;
    const url = window.location.href;
    el.dataset.pageId = window.location.pathname || url;
    el.dataset.pageUrl = url;
    el.dataset.pageTitle = document.title || 'Untitled';
  })();
</script>
<script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
